# Valores recortados para Codespace (kube-prometheus-stack)
# El alumno los pasa con: helm install ... -f infra/monitoring/values.yaml

fullnameOverride: kps

prometheus:
  prometheusSpec:
    retention: 2h
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi
    storageSpec: {}

grafana:
  enabled: true
  adminPassword: admin
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

alertmanager:
  enabled: false

kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
