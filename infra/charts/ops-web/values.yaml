replicaCount: 2
image:
  repository: hashicorp/http-echo
  tag: "1.0.0"
  pullPolicy: IfNotPresent
message: "ops-web via Helm"
service:
  type: ClusterIP
  port: 80
resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
ingress:
  enabled: false
  host: ops.local
