apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-data
  namespace: shop
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  namespace: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory
    spec:
      containers:
        - name: app
          image: busybox:1.37
          command: ["sh", "-c", "echo $(date) start >> /data/log.txt && sleep infinity"]
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: inventory-data
