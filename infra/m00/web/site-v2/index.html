<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>M00 — Web v2</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #3d2412;
      color: #fff7ed;
    }
    .card {
      background: #2a180c;
      padding: 3rem 3.5rem;
      border-radius: 20px;
      text-align: center;
      max-width: 36rem;
    }
    .badge {
      display: inline-block;
      background: #f5a524;
      color: #2a180c;
      font-weight: 700;
      padding: .35rem 1rem;
      border-radius: 999px;
    }
    h1 { font-size: 2.4rem; margin: 1.2rem 0 .6rem; }
    p { line-height: 1.5; color: #f3d5a8; }
  </style>
</head>
<body>
  <div class="card">
    <p class="badge">v2 · misma URL, otra imagen</p>
    <h1>Nueva versión del sitio</h1>
    <p>El puerto no ha cambiado. Lo que cambió es la <strong>etiqueta</strong> de la imagen que está corriendo.</p>
  </div>
</body>
</html>
