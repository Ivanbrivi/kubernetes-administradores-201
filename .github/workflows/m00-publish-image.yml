name: M00 publicar imagen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/m00/web/**"
      - ".github/workflows/m00-publish-image.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/m00-web

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de imagen en minúsculas
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build y push (etapa runtime)
        uses: docker/build-push-action@v6
        with:
          context: infra/m00/web
          file: infra/m00/web/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
